[package]
name = "mestybrovser"
version = "0.1.0"
edition = "2024"
description = "MestyBrovser — a lightweight, customizable browser built with Rust, tao and wry"
license = "MIT"

[dependencies]
dirs = "7.0.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tao = "0.37.2"
wry = "0.57.2"

[target.'cfg(target_os = "linux")'.dependencies]
cairo-rs = { version = "0.18", features = ["png"] }
gtk = "0.18"
webkit2gtk = "2.0"

[dependencies.base64]
version = "0.23"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
